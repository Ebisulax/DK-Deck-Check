<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Fetch YGO Card</title>
</head>
<body>
  <h1>Yu-Gi-Oh! Card Search</h1>

  <input type="text" id="cardName" placeholder="Enter card name" />
  <button onclick="searchCard()">Search</button>

  <pre id="output">Waiting for input...</pre>

  <script>
    function searchCard() {
      const name = document.getElementById('cardName').value.trim();
      if (!name) {
        document.getElementById('output').textContent = 'Please enter a card name.';
        return;
      }

      const url = `https://db.ygoprodeck.com/api/v7/cardinfo.php?fname=${encodeURIComponent(name)}`;

      fetch(url)
        .then(response => {
          console.log('Status:', response.status);
          if (!response.ok) {
            throw new Error('Card not found');
          }
          return response.json();
        })
        .then(data => {
          console.log('Data:', data);
          document.getElementById('output').textContent = JSON.stringify(data, null, 2);
        })
        .catch(error => {
          console.error('Fetch error:', error);
          document.getElementById('output').textContent = 'Error: ' + error.message;
        });
    }
  </script>
</body>
</html>
